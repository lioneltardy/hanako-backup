# ============================================================
#  Config d'un site — copie en monsite.conf et remplis.
# ============================================================

SITE_NAME="monsite"

# --- Connexion SSH Infomaniak ---
SSH_USER="xxxx_monuser"
SSH_HOST="xxxx.ftp.infomaniak.com"
SSH_PORT="22"

# --- Authentification SSH par clé (recommandé sur NAS/cron) ---
# Chemin vers la clé PRIVÉE (la clé publique correspondante doit être
# ajoutée à ~/.ssh/authorized_keys sur le serveur distant).
# Laisse vide/absent pour retomber sur un mot de passe demandé au démarrage.
SSH_KEY="$HOME/.ssh/infomaniak-backup"

# --- Chemin ABSOLU du WordPress distant (dossier de wp-config.php) ---
REMOTE_WP_PATH="/home/clients/xxxx/sites/monsite.ch"

# --- Commande WP-CLI sur le serveur ---
# Selon install: "wp" (classique), "wp-cli", ou "php wp-cli.phar"
WP_CLI_CMD="wp-cli"

# --- Exclusions rsync propres à ce site (en plus de celles déjà codées en
# dur dans hanako-backup.sh : cache, backups, matomo…) ---
# EXTRA_RSYNC_EXCLUDES=('wp-content/uploads/gros-dossier/' '*.zip')

# --- Sauvegardes locales ---
LOCAL_BACKUP_DIR="$HOME/backups-wp"

# --- Copie offsite dédupliquée vers SwissBackup (Swift), via restic ---
# Désactivé par défaut. Si activé, le NAS et SwissBackup suivent la MEME
# politique de rétention (copie conforme) : 30 quotidiens + 12 hebdo +
# 6 mensuels par défaut (ajustable ci-dessous).
RESTIC_ENABLE="false"
# RESTIC_REPOSITORY="swift:container:/monsite"
# RESTIC_PASSWORD_FILE="$HOME/.restic/monsite.pass"
# SWIFT_ENV_FILE="$HOME/.restic/swift-env.sh"   # exporte OS_*/ST_* pour restic
# RESTIC_KEEP_DAILY=30
# RESTIC_KEEP_WEEKLY=12
# RESTIC_KEEP_MONTHLY=6

# --- Notification mail (optionnel) ----------------------------
# Laisser vide pour désactiver. Nécessite msmtp configuré (~/.msmtprc).
MAIL_TO="lionel@aboutblank.ch"